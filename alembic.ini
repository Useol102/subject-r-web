# NOTE: This file MUST stay pure ASCII.
# Alembic reads it with encoding="locale", which is CP949 on Korean Windows.
# A UTF-8 Korean comment here makes alembic crash with a configparser ParsingError.
# Korean comments are fine in .py files (Python reads source as UTF-8).

[alembic]
script_location = alembic
prepend_sys_path = .
# The DB URL is loaded from .env by alembic/env.py, so no password lives here.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
