# 웹 검증 — CLAUDE.md "변경 후 반드시 돌릴 것" 5개를 PR 에서 자동으로 돌린다.
# 로컬(PowerShell) 명령과 같은 것을 돌리므로 여기서 통과하면 손으로 또 돌릴 필요가 없다.
# 새 검사를 넣을 때는 CLAUDE.md 의 목록도 같이 고친다.
name: 웹 검증

# PR 에서 한 번, main 에 들어갈 때 한 번 돈다.
# 작업 브랜치 push 까지 넣으면 PR 하나에 같은 검사가 두 번 돌아 시간만 쓴다.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-web.txt
      - run: python -m pip install -r requirements-web.txt

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci

      - name: API 테스트 (pytest)
        run: python -m pytest tests_web -q

      - name: 프런트 테스트 (vitest)
        run: npm --prefix web test

      - name: 빌드 (tsc + vite)
        run: npm --prefix web run build

      # alembic check 는 DB 를 모델과 비교하므로 먼저 빈 DB 를 head 까지 올린다.
      # -c web-alembic.ini 를 빼면 옛 PostgreSQL 설정이 돌아간다 (CLAUDE.md 0번).
      - name: 마이그레이션 빈 diff (alembic)
        run: |
          python -m alembic -c web-alembic.ini upgrade head
          python -m alembic -c web-alembic.ini check

      - name: 인코딩 검사
        run: python tools/check_encoding.py
